name: Build lgram APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NDK окремо ставити не треба — усі нативні бібліотеки Chaquopy вже готові
      # (підтверджено офіційною документацією: https://chaquo.com/chaquopy/doc/current/android.html).
      # ubuntu-latest вже має потрібний Android SDK попередньо встановлений.

      - name: Set up Python 3.10 (потрібен Chaquopy на САМІЙ білд-машині для pip install)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate gradlew (у репо його ще не закомічено)
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -E '^versionName=' version.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lgram-${{ steps.ver.outputs.version }}
          path: app/build/outputs/apk/debug/*.apk
