name: Build lgram APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (потрібен Chaquopy для нативного Python-рантайму)
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.1.10909125"

      - name: Bootstrap Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Generate gradlew (якщо wrapper ще не закомічено в репо)
        run: gradle wrapper --gradle-version 8.7
        continue-on-error: true

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep versionName version.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lgram-${{ steps.ver.outputs.version }}
          path: app/build/outputs/apk/debug/*.apk
